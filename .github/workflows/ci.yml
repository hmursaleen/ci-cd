name: Django CI

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: django_ci_demo.settings
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run linters
        run: |
          # optional: style checks; don't fail build for style unless you want to
          flake8 || true

      - name: Run tests
        run: |
          pytest -q


#The job provides a postgres service so the same Postgres-backed code path used in Render can be exercised in CI (very helpful to catch DB differences between SQLite and Postgres).

#DATABASE_URL points to the local Postgres service and dj-database-url in settings.py will parse it.

#Caching pip speeds up repeated runs.

#The workflow runs migrations first and then pytest. You can later enable test matrix (multiple Python versions) or upload artifacts and coverage reports